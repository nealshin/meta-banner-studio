function copyGuide(){const mode=state.copy.mode,ready=mode==='suggest'||!!(state.copy.headline||'').trim()||!!(state.copy.subcopy||'').trim(),formats=state.copy.formats.length;return `<aside id="copyGuide" class="card guide product-info-guide"><h3>카피·규격 가이드</h3><ul class="guide-checks">${guideCheck(ready,'카피 작성 방식에 맞춰 문구를 준비하세요.')}${guideCheck(formats>0,'출력 규격을 1개 이상 선택하세요.')}</ul><p>카피 완료 표시는 준비 상태이며, 다음 단계 진행을 막지 않습니다.</p><h3 class="guide-section-title">카피 입력 방식</h3><p><b>직접 입력:</b> 사용할 문구를 적으세요.<br><b>GPT 제안:</b> 메인·보조 문구를 비워두고 기획 단계에서 제안받습니다.<br><b>혼합:</b> 확정된 문구만 적고 빈 문구는 GPT에 맡깁니다.</p><p>가격·할인·혜택·CTA는 선택 사항입니다. 금액이나 할인율은 원본 정보와 대조하세요.</p><h3 class="guide-section-title">광고 방식과 규격</h3><p>완성형은 GPT가 이미지에 문구까지 넣습니다. 편집형은 비주얼 생성 후 7단계에서 문구를 합성합니다.</p><p>선택한 규격 ${formats}개 → 이미지 ${formats}장 요청. 규격마다 구도와 문구 위치를 조정하고, 스토리·릴스의 상하단 안전 영역을 확인하세요.</p></aside>`}

function advertisingGuide(){const selected=state.advertising.selectedTargets||[],done=selected.length>0;return `<aside id="advertisingGuide" class="card guide product-info-guide advertising-guide"><h3>주요 타깃 <span class="req">*</span></h3><ul class="guide-checks">${guideCheck(done,'추천 타깃을 1개 이상 선택하거나 새 대상을 추가하세요.')}</ul><p>추천 선택지를 체크하면 선택한 대상이 광고 기획 요청문에 반영됩니다. 필요 없는 선택지는 ×로 삭제할 수 있습니다.</p><h3 class="guide-section-title">추가 타깃 조건 <span class="hint">선택 사항</span></h3><p>연령·성별은 필요한 경우에만 체크하세요. 추천 타깃 이름에 이미 들어 있다면 중복해서 고르지 않아도 됩니다. 상황·관심사는 아래 입력칸에 적을 수 있습니다.</p><p>이 조건은 광고 소재 기획용이며 Meta 광고 관리자의 타깃 설정을 자동으로 바꾸지는 않습니다.</p><h3 class="guide-section-title">광고 방향·모델</h3><p>타깃의 고민은 제품 정보로 해결 방향을 설명할 수 있을 때만 적으세요. 모델이 등장하면 외형과 행동을 정하고, 같은 인물을 유지하려면 모델 참조 이미지를 생성 채팅에 직접 첨부하세요.</p></aside>`}

function productInfoGuide(){const detail=!!state.assets.detailPages?.length,product=!!state.assets.product,logo=!!state.assets.logo;return `<aside class="card guide product-info-guide"><h3>상세페이지 이미지로 자동 입력</h3><ul class="guide-checks">${guideCheck(detail,'제품 특징과 근거가 읽히도록 상세페이지를 여러 장으로 나눠 등록하세요.')}</ul><ol class="guide-instructions"><li>‘ChatGPT에서 제품정보 분석’을 누른 뒤, 열린 채팅에 <b>같은 상세페이지 이미지를 직접 첨부</b>하고 복사된 요청문을 붙여넣으세요.</li><li>답변의 JSON을 ‘분석 JSON 붙여넣기’에 넣고 ‘제품정보 적용’을 누르세요.</li><li>기본 정보의 수치·효능·가격을 원본 상세페이지와 대조하세요.</li></ol><h3 class="guide-section-title">제품 이미지 가이드</h3><ul class="guide-checks">${guideCheck(product,'제품 원본 이미지를 등록하세요.')}${guideCheck(logo,'브랜드 로고를 등록하세요. (선택)')}</ul><p>제품 형태와 로고가 선명한 고해상도 이미지를 사용하세요. 투명 배경 PNG를 권장합니다.</p><p>여기의 완료 표시는 <b>웹앱에 등록한 상태</b>입니다. ChatGPT에서 분석하거나 이미지를 생성할 때 필요한 이미지는 채팅에 직접 첨부하세요.</p></aside>`}

function switchProject(id){const next=projects.find(p=>p.project.id===id);if(!next)return false;if(!saveNow()){renderProjectSelect();return false}const previous=state;state=next;if(!saveNow()){state=previous;renderProjectSelect();return false}resetImageCache();currentStep=0;renderAll();return true}

function formatWonAmounts(value){const v=String(value??'');const byWon=v.replace(/\d[\d,]*(?=\s*원)/g,n=>Number(n.replace(/,/g,'')).toLocaleString('ko-KR'));return /^[\d,]+$/.test(byWon)?Number(byWon.replace(/,/g,'')).toLocaleString('ko-KR'):byWon}
function field(label,path,value,type='text',extra=''){if(path==='product.regularPrice'||path==='product.salePrice')return `<div class="field"><label>${label}</label><div class="price-entry"><input type="text" inputmode="numeric" data-price="${path}" value="${value===''?'':Number(value).toLocaleString('ko-KR')}" placeholder="0"><span>원</span></div></div>`;return `<div class="field ${extra.includes('full')?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}" ${extra.replace('full','')}>${esc(value)}</textarea>`:`<input type="${type}" data-path="${path}" value="${esc(value)}" ${extra.replace('full','')}>`}</div>`}
function selectField(label,path,value,opts){return `<div class="field"><label>${label}</label><select data-path="${path}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}

function targetField(){const suggestions=Array.isArray(state.productImport.targetSuggestions)?state.productImport.targetSuggestions:[],selected=Array.isArray(state.advertising.selectedTargets)?state.advertising.selectedTargets:[],conditions=Array.isArray(state.advertising.conditionSelections)?state.advertising.conditionSelections:[];return `<div class="field full"><label>주요 타깃 <span class=req>*</span></label><p class="target-help">추천 타깃을 선택하거나 아래에서 직접 추가하세요. 필요 없는 선택지는 ×로 삭제할 수 있습니다.</p>${suggestions.length?`<p class="target-help"><b id="targetSelectionCount">추천 타깃 선택지 ${suggestions.length}개 · 선택 ${selected.length}개</b></p><div class="target-options">${suggestions.map((x,i)=>`<div class="target-choice-wrap"><label class="target-choice"><input type="checkbox" data-target-index="${i}" ${selected.includes(x)?'checked':''}>${esc(x)}</label><button type="button" class="target-delete" data-delete-target="${i}" title="${esc(x)} 선택지 삭제" aria-label="${esc(x)} 선택지 삭제">×</button></div>`).join('')}</div>`:'<p class="target-help">추천 타깃이 없습니다. 아래에서 타깃을 직접 추가하세요.</p>'}<details class="target-more" open><summary>추천 선택지 직접 추가</summary><p class="target-help">추천에 없는 대상을 입력하세요. 쉼표로 여러 개를 구분하면 위 선택지에 추가되고 바로 선택됩니다.</p><div class="target-import"><input type="text" id="targetSuggestionInput" placeholder="예) 출퇴근 직장인, 야외 스포츠를 즐기는 사람"><button type="button" class="btn soft small" id="addTargetSuggestions">선택지에 추가</button></div></details></div><div class="field full strategy-section"><h3>추가 타깃 조건 <span class="hint">선택 사항</span></h3><p class="target-help">위 타깃에 공통으로 적용할 조건입니다. 추천 문구에 이미 적힌 연령·성별은 다시 체크하지 않아도 됩니다. 광고 소재 기획용이며 Meta 광고 관리자 설정은 변경하지 않습니다.</p><div class="target-options">${CONDITION_OPTIONS.map((x,i)=>`<label class="target-choice"><input type="checkbox" data-condition-index="${i}" ${conditions.includes(x)?'checked':''}>${x}</label>`).join('')}</div><label for="manualConditions">연령·성별 외 조건 입력 <span class="hint">선택 사항</span></label><input type="text" id="manualConditions" value="${esc(state.advertising.manualConditions||'')}" placeholder="예) 출퇴근 시 자외선 차단에 관심"><p class="target-help">체크 항목에 없는 상황·관심사를 적으세요. 연령 범위가 필요하면 20~30대처럼 표기할 수 있습니다.</p></div>`}
function syncTargetConditions(){state.advertising.targetConditions=[...(state.advertising.conditionSelections||[]),state.advertising.manualConditions||''].map(x=>x.trim()).filter(Boolean).join(', ');scheduleSave()}

function generationModeHTML(){return `<div class="card mode-card"><h2>광고 생성 방식</h2><div class="radio-cards"><label class="choice"><input type="radio" name="generationMode" value="complete" ${state.generation.mode==='complete'?'checked':''}><strong>완성형 광고</strong><small>GPT가 선택한 규격마다 제품·모델·카피를 포함한 이미지를 완성합니다. 가격·CTA는 입력한 경우에만 넣습니다. 빠른 시안과 광고 테스트에 적합하지만 문구를 개별 수정할 수 없습니다.</small></label><label class="choice recommended"><input type="radio" name="generationMode" value="editable" ${state.generation.mode==='editable'?'checked':''}><strong>편집형 광고</strong><small>GPT가 제품·모델·배경을 완성하고, 정확한 로고·한글·가격·CTA는 7단계에서 합성합니다.</small></label></div><p class="hint">완성형도 7단계에서 전체 이미지 위치·크롭·보정과 추가 문구를 넣을 수 있지만, 이미지에 박힌 기존 문구 자체를 이동하거나 고칠 수는 없습니다.</p></div>`}
function detailImportHTML(){const count=state.assets.detailPages?.length||0;return `<div class="card detail-import"><div class="detail-import-head"><div><h2>상세페이지 이미지로 자동 입력</h2><p>상세페이지 캡처를 여러 장 등록하고, ChatGPT 분석 결과를 JSON으로 받아 기본정보에 적용합니다.</p></div><span class="badge">${count}장 등록</span></div><div class="upload"><input id="detailScreenshots" type="file" accept="image/*" multiple><span class="hint">PNG·JPG·WebP · 여러 장 동시 선택 가능</span></div><p class="detail-capture-tip"><strong>캡처 팁:</strong> 긴 상세페이지는 한 장으로 축소하지 말고, 제품 특징·효능 근거·가격 부분을 <strong>글자가 읽히는 크기</strong>로 나눠 여러 장 첨부해주세요. 같은 이미지를 ChatGPT 채팅에도 번호 순서대로 직접 첨부해야 합니다.</p><div class="screenshot-grid" id="screenshotGrid">${count?'':'<div class="hint">등록된 상세페이지 이미지가 없습니다.</div>'}</div><div class="analysis-grid"><div><label class="field"><span style="display:block;font-size:12px;font-weight:800;margin-bottom:6px">1. ChatGPT 분석</span></label><p class="legal">버튼을 누르면 분석 요청문을 복사하고 ChatGPT를 엽니다.</p><div class="analysis-actions"><button class="btn primary" id="analyzeDetail">ChatGPT에서 제품정보 분석</button><button class="btn soft" id="copyDetailPrompt">분석 요청문만 복사</button></div><div class="detail-analysis-guide"><p><strong>권장 모델:</strong> 이미지 분석이 가능한 모델을 선택해주세요.</p><p><strong>이미지 첨부 필수:</strong> 이곳에 등록한 이미지는 ChatGPT로 자동 전달되지 않습니다. ChatGPT 채팅에 상세페이지 이미지를 이미지 번호 순서대로 직접 첨부해주세요.</p></div></div><div><label style="display:block;font-size:12px;font-weight:800;margin-bottom:6px">2. 분석 JSON 붙여넣기</label><textarea id="analysisJson" placeholder='GPT가 출력한 { "brand": "..." } JSON을 붙여넣으세요'>${esc(state.productImport.analysisJson||'')}</textarea><div class="analysis-actions"><button class="btn purple" id="applyAnalysis">제품정보 적용</button><button class="btn soft" id="clearAnalysis">초기화</button></div></div></div><div class="import-note">AI가 추출한 수치·효능·인증·가격은 반드시 원본 상세페이지와 대조하세요. 확인할 수 없는 내용은 자동 적용하지 않도록 요청문에 포함됩니다.</div></div>`}

 p[0].querySelector('.work-grid>div').insertAdjacentHTML('afterbegin',detailImportHTML());

all" id="pickColor">이미지에서 색상 추출</button></div><label>그림자 강도</label><input id="textShadow" type="range" min="0" max="30" step="1" value="${ss.shadowBlur||0}"><label>글자 테두리</label><input id="strokeWidth" type="range" min="0" max="8" step="0.5" value="${ss.strokeWidth||0}"><label>테두리 색상</label><input id="strokeColor" type="color" value="${ss.strokeColor||'#ffffff'}"><label class="checkline"><input id="boxEnabled" type="checkbox" ${ss.boxEnabled?'checked':''}> 반투명 문구 배경판</label></div><div class="control-group"><h3>전체 가독성 오버레이</h3><label class="checkline"><input id="overlayEnabled" type="checkbox" ${(complete?state.editor.completeOverlayEnabled:state.editor.overlay.enabled)?'checked':''}> 그라데이션 오버레이</label><label>오버레이 색상</label><input id="overlayColor" type="color" value="${state.editor.overlay.color}"><label>강도</label><input id="overlayOpacity" type="range" min="0" max="0.8" step="0.01" value="${state.editor.overlay.opacity}"><select id="overlayDirection"><option value="left">왼쪽 카피 영역</option><option value="right">오른쪽 카피 영역</option><option value="all">전체</option></select></div><div class="safe-toggle"><input id="showSafe" type="checkbox" ${state.editor.showSafe?'checked':''}><label for="showSafe">안전 영역 표시</label></div><div class="copy-row"><button class="btn primary" id="downloadPng">PNG 저장</button><button class="btn purple" id="downloadJpg">JPG 저장</button></div></div><div><div class="canvas-wrap"><div><div class="canvas-shell"><canvas id="bannerCanvas"></canvas></div><div class="canvas-note">추가한 문구를 더블클릭하면 왼쪽 문구 입력칸으로 이동합니다. 이미지에 이미 그려진 글자는 직접 수정할 수 없습니다. · 긴 문구는 모두 줄바꿈하며 공간이 부족하면 축소됩니다. 최종 가독성을 확인하세요. · 안전선과 선택 표시는 저장 이미지에서 제외됩니다.</div></div></div></div><div class="card layers"><h2 style="grid-column:1/-1">추가 편집 레이어</h2><p class="hint">눈 버튼을 누르면 해당 요소가 미리보기와 저장 이미지에서 숨겨집니다. 생성 이미지에 이미 그려진 내용은 지울 수 없습니다.</p>${allowed.map(k=>`<div class="layer ${sel===k?'active':''}" data-layer="${k}"><span>${layerName(k)}</span><button type="button" class="icon-btn small" data-toggle-layer="${k}" aria-label="${layerName(k)} ${layerVisibility()?.[k]===false?'표시':'숨기기'}" title="${layerVisibility()?.[k]===false?'표시':'숨기기'}">${layerVisibility()?.[k]===false?'◌':'◉'}</button></div>`).join('')}</div></div>`}
function getPath(o,path){return path.split('.').reduce((a,k)=>a?.[k],o)}function setPath(o,path,v){const p=path.split('.');let a=o;p.slice(0,-1).forEach(k=>a=a[k]??(a[k]={}));a[p.at(-1)]=v}
function bindPanelEvents(){$$('[data-won]').forEach(el=>el.addEventListener('input',()=>{const pos=el.selectionStart;const value=formatWonAmounts(el.value);if(value!==el.value){const prefix=formatWonAmounts(el.value.slice(0,pos)).length;el.value=value;el.setSelectionRange(prefix,prefix)}}));$$('[data-price]').forEach(el=>el.addEventListener('input',()=>{const digits=el.value.replace(/\D/g,'');el.value=digits?Number(digits).toLocaleString('ko-KR'):'';setPath(state,el.dataset.price,digits?Number(digits):'');scheduleSave()}));$('#manualConditions')?.addEventListener('input',e=>{state.advertising.manualConditions=e.target.value;syncTargetConditions()});$$('[data-condition-index]').forEach(el=>el.onchange=()=>{const name=CONDITION_OPTIONS[Number(el.dataset.conditionIndex)];const choices=new Set(state.advertising.conditionSelections||[]);el.checked?choices.add(name):choices.delete(name);state.advertising.conditionSelections=[...choices];syncTargetConditions()});$$('[data-delete-target]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.deleteTarget),name=state.productImport.targetSuggestions[i];state.productImport.targetSuggestions.splice(i,1);state.advertising.selectedTargets=(state.advertising.selectedTargets||[]).filter(x=>x!==name);syncTargets();renderAll();toast('추천 타깃 선택지를 삭제했습니다.')});$$('[data-target-index]').forEach(el=>el.onchange=()=>{const name=state.productImport.targetSuggestions[Number(el.dataset.targetIndex)];const selected=new Set(state.advertising.selectedTargets||[]);el.checked?selected.add(name):selected.delete(name);state.advertising.selectedTargets=[...selected];syncTargets()});$('#addTargetSuggestions')?.addEventListener('click',()=>{const input=$('#targetSuggestionInput');const added=input.value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,10);if(!added.length){toast('추천 타깃을 입력해주세요.');return}state.productImport.targetSuggestions=[...new Set([...(state.productImport.targetSuggestions||[]),...added])].slice(0,12);state.advertising.selectedTargets=[...new Set([...(state.advertising.selectedTargets||[]),...added.filter(x=>state.productImport.targetSuggestions.includes(x))])];syncTargets();renderAll();$('.target-more')?.scrollIntoView({block:'center',behavior:'smooth'});toast('타깃이 위 선택지에 추가되고 선택됐습니다.')});$$('[data-path]').forEach(el=>{el.addEventListener(el.type==='checkbox'?'change':'input',()=>{let v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':Number(el.value)):el.value;setPath(state,el.dataset.path,v);if(el.dataset.path==='copy.safeArea'){state.editor.showSafe=v;const check=$('#showSafe');if(check)check.checked=v;drawCanvas()}if(el.dataset.path==='advertising.modelEnabled'){$('#modelFields').style.display=v?'grid':'none'}scheduleSave();if(el.dataset.path==='copy.headline'||el.dataset.path==='copy.subcopy')refreshCopyGuide();if(el.dataset.path==='concept.raw'||el.dataset.path==='concept.selected')refreshConceptGuide();if(currentStep===6)drawCanvas()})});$$('[data-go]').forEach(b=>b.onclick=()=>goStep(Number(b.dataset.go)));$$('[data-next]').forEach(b=>b.onclick=()=>{const target=Number(b.dataset.next);if(validateBefore(target))goStep(target)});$$('[data-asset]').forEach(el=>el.onchange=()=>handleAsset(el));$$('[data-remove-asset]').forEach(b=>b.onclick=()=>removeAsset(b.dataset.removeAsset));$$('[data-format]').forEach(c=>c.onchange=()=>{const k=c.dataset.format;if(c.checked){if(!state.copy.formats.includes(k))state.copy.formats.push(k)}else{state.copy.formats=state.copy.formats.filter(x=>x!==k)}normalizeEditor();scheduleSave();refreshCopyGuide()});$$('input[name=copyMode]').forEach(r=>r.onchange=()=>{state.copy.mode=r.value;scheduleSave();renderAll()});$$('[data-copy]').forEach(b=>b.onclick=async()=>{const value=$('#'+b.dataset.copy).value,projectId=state.project.id,ok=await copyText(value);if(ok&&b.dataset.copy==='planningPrompt'){planningCopiedText=value;planningCopiedProjectId=projectId;refreshPlanningGuide()}if(ok&&b.dataset.copy==='instr-all'){instructionCopiedText=value;instructionCopiedProjectId=projectId;refreshInstructionGuide()}});$$('[data-chat]').forEach(b=>b.onclick=()=>openChatGPT($('#'+b.dataset.chat).value));$('#refreshPlanning')?.addEventListener('click',()=>{$('#planningPrompt').value=buildPlanningPrompt();planningCopiedText='';planningCopiedProjectId='';refreshPlanningGuide();toast('최신 입력으로 갱신했습니다.')});$$('[data-instr-tab]').forEach(b=>b.onclick=()=>{$$('[data-instr-tab]').forEach(x=>x.classList.toggle('active',x===b));$$('.instr-panel').forEach(x=>x.style.display=x.dataset.instr===b.dataset.instrTab?'block':'none')});$$('[data-editor-format]').forEach(b=>b.onclick=()=>{state.editor.activeFormat=b.dataset.editorFormat;scheduleSave();renderAll()});bindEditor();showPreviews();ensureFonts()}
function goStep(n){currentStep=Math.max(0,Math.min(6,n));$('#globalError').classList.remove('show');renderAll();scrollTo({top:0,behavior:'smooth'})}
function validateBefore(target){const errs=[];if(target>=1&&!state.product.brand.trim())errs.push('브랜드명을 입력하세요.');if(target>=1&&!state.product.name.trim())errs.push('제품명을 입력하세요.');if(target>=3&&!state.advertising.target.trim())errs.push('주요 타깃을 입력하세요.');if(target>=3&&!state.copy.formats.length)errs.push('출력 규격을 하나 이상 선택하세요.');if(target>=5&&!state.concept.selected.trim()&&!state.concept.raw.trim())errs.push('GPT 기획 결과 또는 선택한 기획안을 입력하세요.');if(errs.length){const box=$('#globalError');box.textContent=errs.join(' ');box.classList.add('show');scrollTo({top:0,behavior:'smooth'});return false}return true}
function buildPlanningPrompt(){const f=state.copy.formats.map(k=>`${FORMATS[k].label}(${FORMATS[k].w}×${FORMATS[k].h})`).join(', ');return `[역할]\n당신은 한국 온라인 커머스와 Meta 광고에 전문성이 있는 광고 기획자이자 아트디렉터입니다. 아래 정보를 바탕으로 실제 배너 제작에 사용할 수 있는 서로 다른 기획안 3개를 제안해주세요.\n\n[제품]\n- 브랜드: ${state.product.brand||'(미입력)'}\n- 제품명: ${state.product.name||'(미입력)'}\n- 대분류: ${state.product.category}\n- 세부 카테고리: ${state.product.detailCategory||'(미입력)'}\n- 설명: ${state.product.description||'(미입력)'}\n- 핵심 USP: ${state.product.usp||'(미입력)'}\n- 정상가/할인가: ${state.product.regularPrice||'-'}원 / ${state.product.salePrice||'-'}원\n- 반드시 포함: ${state.product.required||'없음'}\n- 금지 표현: ${state.product.prohibited||'없음'}\n- 외형 보존 포인트: ${state.product.preserve||'원본 제품의 색상, 비율, 로고, 버튼과 구조를 변경하지 말 것'}\n\n[광고]\n- 타깃: ${state.advertising.target||'(미입력)'}\n- 추가 타깃 조건 (선택한 타깃에 공통 적용): ${state.advertising.targetConditions||'없음'}\n- 타깃 고민: ${state.advertising.pain||'(미입력)'}\n- 목적: ${state.advertising.objective}\n- 콘텐츠: ${state.advertising.contentType}\n- 분위기/배경: ${state.advertising.mood} / ${state.advertising.backgroundStyle}\n- 제품 배치: ${state.advertising.placement}\n- 브랜드 색상: ${state.advertising.brandColor}\n- 모델: ${state.advertising.modelEnabled?`${state.model.nationality}, ${state.model.gender}, ${state.model.age}, ${state.model.hair}, ${state.model.clothing}, ${state.model.impression}, ${state.model.extra}`:'사용하지 않음'}\n\n[카피]\n- 입력 방식: ${state.copy.mode==='direct'?'직접 입력 문구 우선':state.copy.mode==='suggest'?'GPT가 제안':'직접 입력과 제안을 함께 사용'}\n- 헤드라인: ${state.copy.mode==='suggest'?'GPT 제안 필요':state.copy.headline||'제안 필요'}\n- 보조 문구: ${state.copy.mode==='suggest'?'GPT 제안 필요':state.copy.subcopy||'제안 필요'}\n- 정상가 표기: ${state.copy.regularPriceText||'표기하지 않음'}\n- 판매가 표기: ${state.copy.priceText||'표기하지 않음'}\n- 할인 정보: ${state.copy.discount||'표기하지 않음'}\n- 혜택: ${state.copy.benefit||'표기하지 않음'}\n- CTA: ${state.copy.cta||'표기하지 않음'}\n- 규격: ${f}\n- 안전 영역: ${state.copy.safeArea?'각 규격의 가장자리와 스토리 앱 UI 영역을 피해서 핵심 요소 배치':'별도 안전 영역 지정 없음'}\n\n[출력 요청]\n각 기획안별로 헤드라인과 보조 문구는 각각 독립된 줄에 '헤드라인: 문구', '보조 문구: 문구' 형식으로 명시해주세요. 기획안별로 ①핵심 콘셉트 ②주요 소구점 ③헤드라인/보조문구와 입력된 혜택/CTA ④배경과 조명 ⑤제품 배치 ⑥모델 연출(해당 시) ⑦규격별 레이아웃 차이 ⑧광고 성과 관점의 장단점을 작성해주세요. ${state.generation.mode==='complete'?'완성형 광고이므로 각 규격에 카피와 CTA를 포함하되 규격에 맞춰 위치를 조정하는 기획으로 작성해주세요.':'편집형 광고이므로 이미지에 카피·가격·CTA·별도 로고를 넣지 않고 7단계에서 합성할 여백을 고려해 기획해주세요.'}`}
function generationGuideHTML(){const product=state.assets.product?'<span class="asset-chip ok">✓ 제품 이미지 준비됨</span>':'<span class="asset-chip warn">! 제품 이미지 미등록</span>';const logo=state.assets.logo?'<span class="asset-chip ok">✓ 로고 준비됨</span>':'<span class="asset-chip">로고 선택 첨부</span>';const model=state.advertising.modelEnabled?(state.assets.model?'<span class="asset-chip ok">✓ 모델 이미지 준비됨</span>':'<span class="asset-chip warn">! 모델 이미지 미등록</span>'):'';return `<div class="generation-guide"><h3>이미지 생성 방법</h3><ol><li>‘1. 지시서 복사’를 누른 뒤 ‘2. ChatGPT에서 생성’을 눌러 새 탭을 엽니다.</li><li>채팅창의 <b>+</b>에서 <b>이미지 만들기</b>를 선택합니다.</li><li><b>제품 원본 이미지(필수)</b>, 로고(선택), 모델 이미지(사용 시)를 직접 첨부합니다.</li><li>복사한 지시서를 붙여넣고 선택한 규격 수만큼 각각의 이미지를 요청합니다.</li></ol><div class="asset-checks">${product}${logo}${model}</div><p class="hint">표시는 프로그램 등록 상태입니다. ChatGPT에는 이미지를 다시 직접 첨부해야 합니다. 생성 장수는 요청 내용이며, 누락된 규격은 같은 채팅에서 이어서 요청하세요.</p></div>`}
function buildCombinedInstruction(){syncConceptCopy();const formats=state.copy.formats.filter(k=>FORMATS[k]),count=formats.length,complete=state.generation.mode==='complete',concept=state.concept.selected||state.concept.raw||'(선택한 기획안 미입력)',model=state.advertising.modelEnabled?`반드시 ${[state.model.nationality,state.model.gender,state.model.age,state.model.hair,state.model.clothing,state.model.impression,state.model.extra].filter(Boolean).join(', ')} 모델을 사용.${state.model.sameModel&&state.assets.model?' 첨부한 모델 참조 이미지의 인물을 모든 규격에서 최대한 동일하게 유지.':''}`:'사람이나 모델은 등장시키지 말 것.',layouts={square:'정사각 구도. 제품과 핵심 메시지를 한눈에 읽히도록 균형 있게 배치.',portrait:'4:5 세로 피드 구도. 제품과 메시지를 상하 흐름에 맞게 재배치.',story:'9:16 세로 구도. 세로 흐름에 맞춰 핵심 요소를 배치.'};if(!count)return '3단계에서 출력 규격을 하나 이상 선택해주세요.';const list=formats.map((k,i)=>`${i+1}. ${FORMATS[k].label} — ${FORMATS[k].w}×${FORMATS[k].h}: ${layouts[k]}${safeAreaInstruction(k)}`).join('\n');const copy=complete?`각 이미지에 다음 카피를 규격에 맞게 읽기 좋은 위치로 배치하세요. 입력되지 않은 가격·할인·혜택은 임의로 만들지 말고 생략하세요.\n- 헤드라인: ${effectiveCopy('headline')||'선택 기획의 헤드라인 사용 (5단계 확인 필요)'}\n- 보조 문구: ${effectiveCopy('subcopy')||'입력 없음 — 생략'}\n- 정상가: ${state.copy.regularPriceText||'입력 없음 — 생략'}\n- 판매가: ${state.copy.priceText||'입력 없음 — 생략'}\n- 할인: ${state.copy.discount||'입력 없음 — 생략'}\n- 혜택: ${state.copy.benefit||'입력 없음 — 생략'}\n- CTA: ${state.copy.cta||'입력 없음 — 생략'}\n한글과 숫자를 정확히 표기하고 모바일에서도 읽히도록 할 것. 첨부 로고가 있으면 형태를 바꾸지 말고 사용할 것.`:`광고 배경, 제품, 모델, 조명과 시각 효과만 생성하세요. 헤드라인·가격·할인율·혜택·CTA 버튼·별도 로고·워터마크를 이미지에 만들지 마세요. 제품 패키지에 원래 인쇄된 글자와 로고는 보존하세요. 각 규격마다 나중에 7단계에서 카피를 합성할 여백을 확보하세요.`;return `[Meta ${complete?'완성형 광고 이미지':'편집형 광고 비주얼'} 생성 작업지시서]\n\n아래 선택 규격 ${count}개에 맞춰 별도의 이미지 ${count}장을 생성해주세요. 각 규격마다 정확히 한 장씩 출력하고, 여러 규격을 한 장에 합친 콜라주는 만들지 마세요. 같은 기획 콘셉트와 제품·모델·색감은 유지하되, 단순 크롭이나 비율 늘이기 없이 제품, 모델과 ${complete?'문구':'카피 여백'}의 위치를 규격별로 재구성하세요. 한 번에 모두 생성하지 못하면 남은 규격을 같은 대화에서 이어서 생성해주세요.\n\n[출력 순서와 규격]\n${list}\n\n[공통 기획]\n제품: ${state.product.brand} ${state.product.name}\n카테고리: ${state.product.category} > ${state.product.detailCategory||'미입력'}\n제품 설명/USP: ${state.product.description} / ${state.product.usp}\n반드시 포함할 내용: ${state.product.required||'없음'}\n사용 금지 표현: ${state.product.prohibited||'없음'}\n외형 보존 포인트: ${state.product.preserve||'원본 제품의 형태·색상·비율·패키지 보존'}\n선택 기획: ${concept}\n추가 수정: ${state.concept.notes||'없음'}\n타깃: ${state.advertising.target}; 추가 조건: ${state.advertising.targetConditions||'없음'}; 고민: ${state.advertising.pain||'없음'}\n분위기: ${state.advertising.mood}, ${state.advertising.backgroundStyle}; 브랜드 색상: ${state.advertising.brandColor}\n제품 배치 방향: ${state.advertising.placement}. 비율에 따라 위치를 조정해도 됩니다.\n모델: ${model}\n\n[이미지 제작 규칙]\n첨부한 제품 원본의 형태, 색상, 비율과 패키지 디자인을 최대한 정확하게 유지해 자연스럽게 배치하세요. ${copy}\n임의의 효능·수치·인증을 추가하지 말고 워터마크를 넣지 마세요.\n\n이미지는 위 순서대로 규격별로 구분해 출력해주세요.`}
async function copyText(s){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);toast('클립보드에 복사했습니다.');return true}}catch(e){}const area=document.createElement('textarea');area.value=s;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';area.style.top='0';document.body.append(area);area.select();area.setSelectionRange(0,area.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}area.remove();toast(ok?'클립보드에 복사했습니다.':'복사할 수 없습니다. 문구를 직접 선택해 복사하세요.');return ok}
function openChatGPT(){window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
async function handleAsset(input){const file=input.files?.[0];if(!file)return;const imageExt=/\.(png|jpe?g|webp|gif|avif)$/i.test(file.name);if(!file.type.startsWith('image/')&&!imageExt){toast('PNG, JPG, WebP 등 이미지 파일만 사용할 수 있습니다.');return}if(file.size>30*1024*1024){toast('이미지는 30MB 이하를 사용해주세요.');return}const owner=state,key=input.dataset.asset,assetId=owner.project.id+':'+key;let decoded;try{decoded=await fileToImage(file)}catch(e){console.error('image decode',e);toast('이미지를 해석할 수 없습니다. 다른 형식으로 저장해 다시 시도하세요.');return}const meta={id:assetId,name:file.name,type:file.type||'image/unknown',size:file.size,lastModified:file.lastModified};assetPreviewFiles[assetId]=file;setPath(owner,'assets.'+key,meta);if(state===owner){images[key]=decoded;scheduleSave();drawCanvas()}let stored=true;try{await idbPut(assetId,file)}catch(e){stored=false;console.warn('asset storage unavailable',e)}if(state===owner)renderAll();toast(stored?'이미지를 불러오고 브라우저에 저장했습니다.':'이미지는 불러왔지만 새로고침 후에는 다시 첨부해야 합니다.')}
async function removeAsset(key){const m=getPath(state,'assets.'+key);if(m?.id)await idbDelete(m.id);setPath(state,'assets.'+key,null);if(m?.id)delete assetPreviewFiles[m.id];delete images[key];scheduleSave();renderAll()}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('MetaBannerStudioAssets',1);q.onupgradeneeded=()=>q.result.createObjectStore('assets');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function idbGet(k){const db=await openDB();return new Promise((res,rej)=>{const q=db.transaction('assets').objectStore('assets').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function idbDelete(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function fileToImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image;im.onload=()=>{URL.revokeObjectURL(url);res(im)};im.onerror=rej;im.src=url})}
async function loadAllImages(){const project=state,epoch=++imageEpoch,loaded={},keys=['product','logo',...Object.keys(FORMATS).map(k=>'backgrounds.'+k)];await Promise.all(keys.map(async k=>{const m=getPath(project,'assets.'+k);if(m){try{const b=assetPreviewFiles[m.id]||await idbGet(m.id);if(b)loaded[k]=await fileToImage(b)}catch(e){console.warn('asset load',k,e)}}}));if(state===project&&epoch===imageEpoch)images=loaded}
async function showPreviews(){for(const k of ['product','logo','model']){const im=$('#prev-'+k),meta=getPath(state,'assets.'+k);if(!im||!meta)continue;try{const blob=assetPreviewFiles[meta.id]||await idbGet(meta.id);if(blob&&im.isConnected){const url=URL.createObjectURL(blob);im.onload=im.onerror=()=>URL.revokeObjectURL(url);im.src=url;im.style.display='block'}}catch(e){console.warn('preview unavailable',k,e)}}}
function bindDetailImport(){const input=$('#detailScreenshots');if(!input)return;input.onchange=async()=>{await addDetailScreenshots([...input.files]);input.value=''};$('#analyzeDetail').onclick=async()=>{if(!state.assets.detailPages.length){toast('먼저 상세페이지 캡처를 등록하세요.');return}const copying=copyText(buildDetailAnalysisPrompt());openChatGPT();if(!await copying)toast('요청문 복사에 실패했습니다. 요청문 복사 버튼을 다시 눌러주세요.')};$('#copyDetailPrompt').onclick=()=>copyText(buildDetailAnalysisPrompt());$('#analysisJson').oninput=e=>{state.productImport.analysisJson=e.target.value;scheduleSave()};$('#applyAnalysis').onclick=applyProductAnalysis;$('#clearAnalysis').onclick=()=>{state.productImport.analysisJson='';scheduleSave();$('#analysisJson').value='';toast('분석 JSON을 초기화했습니다.')}}
async function addDetailScreenshots(files){const owner=state;let added=0;for(const file of files){if(!file.type.startsWith('image/')&&!/\.(png|jpe?g|webp|gif|avif)$/i.test(file.name))continue;if(file.size>30*1024*1024){toast(file.name+'은 30MB를 초과해 제외했습니다.');continue}const id=uid(),assetId=owner.project.id+':detail:'+id,key='detail:'+id;try{images[key]=await fileToImage(file)}catch(e){continue}const meta={id:assetId,itemId:id,name:file.name,type:file.type||'image/unknown',size:file.size,lastModified:file.lastModified};detailPreviewFiles[assetId]=file;owner.assets.detailPages.push(meta);try{await idbPut(assetId,file)}catch(e){console.warn('detail image storage unavailable',e)}added++}scheduleSave();renderAll();toast(added+'장의 상세페이지 이미지를 등록했습니다.')}
async function renderDetailPreviews(){const grid=$('#screenshotGrid');if(!grid)return;grid.textContent='';for(let i=0;i<state.assets.detailPages.length;i++){const m=state.assets.detailPages[i];const box=document.createElement('div');box.className='screenshot-item';const img=document.createElement('img');img.alt='상세페이지 이미지 '+(i+1)+' · '+m.name;try{const blob=detailPreviewFiles[m.id]||await idbGet(m.id);if(blob){const url=URL.createObjectURL(blob);img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url}else{img.alt='미리보기 없음 · '+m.name}}catch(e){img.alt='미리보기 없음 · '+m.name}const num=document.createElement('b');num.textContent='이미지 '+(i+1);const filename=document.createElement('span');filename.className='screenshot-filename';filename.textContent=m.name;filename.title=m.name;const controls=document.createElement('div');controls.className='screenshot-controls';for(const [label,offset] of [['↑ 앞',-1],['↓ 뒤',1]]){const button=document.createElement('button');button.type='button';button.textContent=label;button.disabled=i+offset<0||i+offset>=state.assets.detailPages.length;button.onclick=()=>moveDetailScreenshot(m.itemId,offset);controls.append(button)}const del=document.createElement('button');del.type='button';del.className='screenshot-delete';del.textContent='삭제';del.title=m.name+' 삭제';del.onclick=()=>removeDetailScreenshot(m.itemId);controls.append(del);box.append(img,num,filename,controls);grid.append(box)}if(!state.assets.detailPages.length){const empty=document.createElement('div');empty.className='hint';empty.textContent='등록된 상세페이지 이미지가 없습니다.';grid.append(empty)}}
function moveDetailScreenshot(itemId,offset){const list=state.assets.detailPages,i=list.findIndex(x=>x.itemId===itemId),next=i+offset;if(i<0||next<0||next>=list.length)return;[list[i],list[next]]=[list[next],list[i]];scheduleSave();renderAll()}

function buildDetailAnalysisPrompt(){return `[상세페이지 제품정보 분석]\n당신은 한국 온라인 커머스 상품정보 분석가입니다. 지금부터 첨부하는 상세페이지 캡처 ${state.assets.detailPages.length}장을 이미지 1부터 순서대로 분석해주세요.\n\n규칙:\n1. 이미지에서 직접 확인되는 내용만 추출하고 절대 추측하지 마세요.\n2. 수치, 시험 결과, 인증, 효능, 가격은 확인된 이미지 번호를 evidence에 기록하세요.\n3. 읽을 수 없거나 확실하지 않은 값은 빈 문자열 또는 빈 배열로 두세요.\n4. description에는 이미지에서 확인한 제품 유형·용도·외형을 간결하게 적으세요. 포장 그림만으로 실제 성분이나 효능을 추정하지 마세요.\n5. usp에는 상세페이지에서 확인한 실제 제품 특징을 소비자가 이해할 수 있는 짧은 표현으로 1개씩 쓰세요. 예: "SPF 50+ PA++++"(이미지에서 확인된 경우). "촉촉함을 강조하는 광고 문구", "자외선 차단을 소구함", "상세페이지는 ~를 강조함"처럼 문구 자체를 설명하는 문장은 쓰지 마세요. 확인 가능한 특징이 없다면 usp는 []로 두세요.\n6. 광고 문구와 객관적 제품정보를 구분하세요.\n7. 제품 특징을 바탕으로 광고 타깃을 2~4개 제안하세요. 이는 분석에 따른 제안이며 사실 정보와 구분하세요.\n8. 아래 JSON 한 개만 출력하고 코드펜스나 설명은 붙이지 마세요.\n\n{\n  "brand": "",\n  "name": "",\n  "category": "생활·건강|식품|출산·육아|화장품·미용|패션·잡화|기타 중 하나",\n  "detailCategory": "",\n  "description": "",\n  "usp": [""],\n  "regularPrice": "",\n  "salePrice": "",\n  "required": [""],\n  "prohibited": [""],\n  "preserve": ["제품의 색상·용기·패키지 등 외형 특징"],\n  "recommendedTargets": ["제품 특징에 맞는 구체적인 광고 타깃"],\n  "evidence": [{"claim":"", "sourceImage":1}],\n  "needsReview": ["확인이 필요한 항목"]\n}`}

function drawLayer(ctx,k,f){const l=state.editor.layouts[state.editor.activeFormat][k];ctx.save();ctx.translate(l.x*f.w,l.y*f.h);ctx.rotate(l.rotation*Math.PI/180);if(k==='logo'){const im=images.logo;if(im){const max=f.w*.35*l.scale,s=Math.min(max/im.width,f.h*.18*l.scale/im.height),w=im.width*s,h=im.height*s;ctx.drawImage(im,-w/2,-h/2,w,h)}}else{const txt=editableLayerText(k);if(!txt){ctx.restore();return}const s=state.editor.styles[k],size=s.size*l.scale,font=(s.font||'Pretendard')==='Pretendard'?'Pretendard Variable':'Noto Sans KR';ctx.font=`${s.weight} ${size}px "${font}","Noto Sans KR",Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=`rgba(0,0,0,${s.shadowOpacity??.2})`;ctx.shadowBlur=s.shadowBlur||0;ctx.shadowOffsetY=(s.shadowBlur||0)*.35;const metrics=ctx.measureText(txt),boxW=Math.min(f.w*.78,Math.max(220,metrics.width+size*1.5)),boxH=size*(k==='headline'?3:2);if(s.boxEnabled){ctx.save();ctx.shadowColor='transparent';ctx.fillStyle=hexRgba(s.boxColor||'#ffffff',s.boxOpacity??.72);roundRect(ctx,-boxW/2,-boxH/2,boxW,boxH,Math.min(26,boxH/3));ctx.fill();ctx.restore()}if(k==='cta'){const ctaLines=textLines(ctx,txt,f.w*.65),w=Math.min(f.w*.78,Math.max(220,metrics.width+80)),h=Math.min(f.h*.4,Math.max(size*2,ctaLines.length*size*1.25+size));ctx.shadowColor='transparent';ctx.fillStyle=s.bg;roundRect(ctx,-w/2,-h/2,w,h,h/2);ctx.fill();ctx.fillStyle=s.color;if(s.strokeWidth){ctx.lineWidth=s.strokeWidth;ctx.strokeStyle=s.strokeColor;strokeWrappedText(ctx,txt,0,2,f.w*.65,size*1.25)}wrapText(ctx,txt,0,2,f.w*.65,size*1.25)}else{ctx.fillStyle=s.color;if(s.strokeWidth){ctx.lineWidth=s.strokeWidth;ctx.strokeStyle=s.strokeColor;strokeWrappedText(ctx,txt,0,0,f.w*.72,size*1.25)}wrapText(ctx,txt,0,0,f.w*.72,size*1.25)}}ctx.restore()}
function wrapText(ctx,text,x,y,max,lineH){drawWrapped(ctx,text,x,y,max,lineH,false)}
function strokeWrappedText(ctx,text,x,y,max,lineH){drawWrapped(ctx,text,x,y,max,lineH,true)}
function textLines(ctx,text,max){const lines=[];for(const para of String(text).split('\n')){let line='';for(const ch of Array.from(para)){if(line&&ctx.measureText(line+ch).width>max){lines.push(line.trimEnd());line=ch.trimStart()}else line+=ch}lines.push(line)}return lines}
function drawWrapped(ctx,text,x,y,max,lineH,stroke){const lines=textLines(ctx,text,max),height=lines.length*lineH,scale=Math.min(1,(FORMATS[state.editor.activeFormat].h*.35)/height);ctx.save();ctx.scale(scale,scale);const sy=y-(lines.length-1)*lineH/2;lines.forEach((v,i)=>ctx[stroke?'strokeText':'fillText'](v,x,sy+i*lineH));ctx.restore()}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
function drawSelection(ctx,k,f){const l=state.editor.layouts[state.editor.activeFormat][k];ctx.save();ctx.strokeStyle='#356ae6';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeRect(l.x*f.w-70,l.y*f.h-45,140,90);ctx.restore()}
async function downloadCanvas(type){await ensureFonts();drawCanvas(true);const c=$('#bannerCanvas'),f=FORMATS[state.editor.activeFormat],a=document.createElement('a');a.download=`${safeName(state.product.name||state.project.name)}_${f.w}x${f.h}.${type==='png'?'png':'jpg'}`;a.href=c.toDataURL('image/'+type,type==='jpeg'?.92:undefined);a.click();drawCanvas(false);toast(type==='png'?'PNG를 저장했습니다.':'JPG를 저장했습니다.')}
async function ensureFonts(){if(!document.fonts)return;const names=[...new Set(Object.values(state.editor.styles).map(s=>s.font).filter(Boolean))],missing=[];await Promise.all(names.map(async name=>{try{const loaded=await document.fonts.load('700 32px "'+(name==='Pretendard'?'Pretendard Variable':name)+'"','한글');if(!loaded.length)missing.push(name)}catch(e){missing.push(name)}}));const el=$('#fontStatus');if(el)el.textContent=missing.length?'글꼴을 불러오지 못해 기본 글꼴로 표시·저장됩니다: '+missing.join(', '):'선택 글꼴을 불러왔습니다.';drawCanvas()}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_').trim()||'banner'}
function assetMetas(assets){return [assets?.product,assets?.logo,assets?.model,...(assets?.detailPages||[]),...Object.values(assets?.backgrounds||{})].filter(x=>x&&x.id)}
function blobDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
function dataURLBlob(url){const [header,data]=url.split(',');if(!header?.startsWith('data:')||!data)throw new Error('백업 이미지 형식이 올바르지 않습니다.');const type=header.slice(5).split(';')[0]||'application/octet-stream';const bytes=atob(data),array=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)array[i]=bytes.charCodeAt(i);return new Blob([array],{type})}
async function exportJSON(){try{saveNow();const data=clone(state),assets={};for(const meta of assetMetas(data.assets)){const blob=detailPreviewFiles[meta.id]||assetPreviewFiles[meta.id]||await idbGet(meta.id);if(!blob)throw new Error('저장된 이미지 '+meta.name+'을 찾지 못했습니다. 다시 첨부한 뒤 백업해주세요.');assets[meta.id]=await blobDataURL(blob)}const payload={backupFormat:'metaBannerStudio.full.v1',project:data,images:assets},blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=safeName(state.project.name)+'_전체백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('이미지 포함 프로젝트 백업을 내려받았습니다.')}catch(e){toast('백업 실패: '+e.message)}}
async function importJSON(file){const inserted=[];if(!saveNow())return;const previous=state,previousProjects=projects.slice();let committed=false;try{const raw=JSON.parse(await file.text()),full=raw.backupFormat==='metaBannerStudio.full.v1',p=migrate(full?raw.project:raw),newId=uid();p.project.id=newId;p.project.name=(p.project.name||'가져온 프로젝트')+' (가져옴)';p.project.createdAt=new Date().toISOString();if(full){for(const meta of assetMetas(p.assets)){const data=raw.images?.[meta.id];if(typeof data!=='string')throw new Error('백업에서 이미지 '+meta.name+'이 누락됐습니다.');const newAssetId=newId+':'+meta.id;await idbPut(newAssetId,dataURLBlob(data));inserted.push(newAssetId);meta.id=newAssetId} }else{p.assets={product:null,logo:null,model:null,detailPages:[],backgrounds:{square:null,portrait:null,story:null}}}state=p;if(!saveNow())throw new Error('프로젝트 저장 공간이 부족하거나 저장이 차단되었습니다.');committed=true;resetImageCache();currentStep=0;renderAll();$('#projectModal').classList.remove('show');toast(full?'프로젝트와 이미지를 복원했습니다.':'설정을 가져왔습니다. 이미지는 다시 첨부하세요.')}catch(e){if(!committed){state=previous;projects=previousProjects;for(const id of inserted)await idbDelete(id).catch(()=>{});renderProjectSelect()}toast('프로젝트 복원 실패: '+e.message)}}
function renderProjectList(){$('#projectList').innerHTML=projects.map(p=>`<div class="project-item"><span><strong>${esc(p.project.name)}</strong><br><small>${new Date(p.project.updatedAt).toLocaleString('ko-KR')}</small></span><button class="btn soft small" data-open-project="${p.project.id}">열기</button>${projects.length>1?`<button class="btn danger small" data-delete-project="${p.project.id}">삭제</button>`:''}</div>`).join('');$$('[data-open-project]').forEach(b=>b.onclick=()=>{if(switchProject(b.dataset.openProject))$('#projectModal').classList.remove('show')});$$('[data-delete-project]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.deleteProject))}
async function deleteProject(id){if(projects.length<=1||!confirm('이 프로젝트와 브라우저에 저장된 이미지를 삭제할까요?'))return;if(!saveNow())return;const previous=state,previousProjects=projects.slice(),p=projects.find(x=>x.project.id===id);projects=projects.filter(x=>x.project.id!==id);if(state.project.id===id)state=projects[0];if(!saveNow()){state=previous;projects=previousProjects;renderProjectSelect();return}resetImageCache();const used=new Set(projects.flatMap(p=>assetMetas(p.assets).map(m=>m.id)));await Promise.all(assetMetas(p.assets).filter(m=>!used.has(m.id)).map(m=>idbDelete(m.id).catch(()=>{})));renderProjectList();renderAll();toast('프로젝트를 삭제했습니다.')}
function wireGlobal(){$('#projectSelect').onchange=e=>switchProject(e.target.value);$('#newProject').onclick=()=>{const name=prompt('새 프로젝트 이름','새 광고 프로젝트');if(name===null)return;if(!saveNow())return;const previous=state;state=defaults(name.trim()||'새 광고 프로젝트');if(!saveNow()){state=previous;renderProjectSelect();return}resetImageCache();currentStep=0;renderAll();toast('새 프로젝트를 만들었습니다.')};$('#manageProjects').onclick=()=>{renderProjectList();$('#projectModal').classList.add('show')};$$('[data-close]').forEach(b=>b.onclick=()=>$('#projectModal').classList.remove('show'));$('#exportJson').onclick=exportJSON;$('#importJson').onclick=()=>$('#jsonImport').click();$('#jsonImport').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''};$('#projectModal').onclick=e=>{if(e.target===$('#projectModal'))e.currentTarget.classList.remove('show')};document.addEventListener('change',e=>{if(e.target.name==='generationMode'){state.generation.mode=e.target.value;scheduleSave();renderAll();toast(e.target.value==='complete'?'완성형 광고 모드를 선택했습니다.':'편집형 광고 모드를 선택했습니다.')}})}
loadProjects();wireGlobal();renderAll();window.MetaBannerStudio={getState:()=>clone(state),validate:validateBefore,buildPlanningPrompt,buildInstruction:buildCombinedInstruction,buildCombinedInstruction,saveNow,migrate};
})();
